<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Témoignage SEP — Portfolio Alyssia Mattioni</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo perso.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/projet.css" />
  <style>
    /* 4 vidéos verticales côte à côte */
    .videos-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }
    .videos-row video {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      object-position: center top;
      display: block;
      background: #f5f5f5;
      border-radius: 2px;
    }

    /* 2 affiches format A3 portrait — affichées en entier, côte à côte */
    .posters-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 36px;
      align-items: start;
    }
    .posters-row img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      background: transparent;
      border-radius: 2px;
    }

    @media (max-width: 700px) {
      .videos-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .videos-row { grid-template-columns: 1fr; }
      .posters-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <main>
    <a class="back-link" href="motion-design.html">← Retour à Motion design</a>

    <span class="project-tag">Association</span>
    <h1>Témoignage SEP</h1>

    <div class="project-description">
      <p>
        Témoignage anonyme d'une personne atteinte de la sclérose en plaques, réalisé pour l'AFSEP dans un format adapté aux réseaux sociaux.
      </p>
    </div>

    <!-- 4 vidéos verticales côte à côte -->
    <div class="videos-row">
      <video controls playsinline>
        <source src="img/Animation AFSEP.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan10_afsep.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan9_afsep.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan3_afsep.mp4" type="video/mp4">
      </video>
    </div>

    <!-- 2 affiches A3 portrait, entières et côte à côte -->
    <div class="posters-row">
      <img src="img/affiche_1.png" alt="Affiche AFSEP 1" />
      <img src="img/affiche_2.png" alt="Affiche AFSEP 2" />
    </div>

  </main>

  <footer>
    <a href="mailto:alyssia.mattioni@gmail.com">alyssia.mattioni@gmail.com</a>
  </footer>

  <a class="next-project" href="3d.html" aria-label="Projet suivant : 3D">
    <span class="next-project__label">3D</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M5 12h14m0 0l-6-6m6 6l-6 6" />
    </svg>
  </a>

</body>
</html>
