<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Témoignage SEP — Portfolio Alyssia Mattioni</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="img/logo perso.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/projet.css" />
  <style>
    /* Styles propres à cette page — forcent la grille compacte */
    .media-grid {
      display: grid;
      gap: 14px;
      margin-bottom: 30px;
    }
    .media-grid--videos {
      grid-template-columns: repeat(4, 1fr);
    }
    .media-grid--posters {
      grid-template-columns: repeat(2, 1fr);
    }
    .media-grid video,
    .media-grid img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      background: #f5f5f5;
    }
    .media-grid video {
      aspect-ratio: 9 / 16;
    }
    .media-grid img {
      aspect-ratio: 4 / 3;
    }
    @media (max-width: 900px) {
      .media-grid--videos { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .media-grid--videos { grid-template-columns: 1fr; }
      .media-grid--posters { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <main>
    <a class="back-link" href="motion-design.html">← Retour à Motion design</a>

    <span class="project-tag">Association</span>
    <h1>Témoignage SEP</h1>

    <div class="project-description">
      <p>
        Témoignage anonyme d'une personne atteinte de la sclérose en plaques, réalisé pour l'AFSEP dans un format adapté aux réseaux sociaux.
      </p>
    </div>

    <!-- 4 vidéos côte à côte -->
    <div class="media-grid media-grid--videos">
      <video controls playsinline>
        <source src="img/Animation AFSEP.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan10_afsep.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan9_afsep.mp4" type="video/mp4">
      </video>
      <video controls playsinline>
        <source src="img/plan3_afsep.mp4" type="video/mp4">
      </video>
    </div>

    <!-- 2 affiches côte à côte -->
    <div class="media-grid media-grid--posters">
      <img src="img/affiche_1.png" alt="Affiche AFSEP 1" />
      <img src="img/affiche_2.png" alt="Affiche AFSEP 2" />
    </div>

  </main>

  <footer>
    <a href="mailto:alyssia.mattioni@gmail.com">alyssia.mattioni@gmail.com</a>
  </footer>
