    h1 { font-weight: 700; }

    /* Grille 2x2 pour les images */
    .images-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      margin-bottom: 36px;
      align-items: start;

    .images-grid img {

      background: #f5f5f5;
      border-radius: 2px;
      object-fit: contain; /* L'image est entière, pas coupée */
