<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>alyssia_mattioni</title>
    <link rel="stylesheet" href="style.css?v=17">

    <!-- L'animation du début ne se joue qu'une fois par visite (pas quand on revient depuis une autre page) -->
    <script>
        try {
            var nav = performance.getEntriesByType('navigation')[0];
            var rechargement = nav && nav.type === 'reload';
            if (sessionStorage.getItem('introVue') && !rechargement) {
                document.documentElement.classList.add('deja-vu');
            } else {
                sessionStorage.setItem('introVue', '1');
            }
        } catch (e) {}
    </script>
</head>
<body>

    <!-- L'animation du début : disparaît toute seule (voir le CSS) -->
    <div id="intro">
        <video src="img/carte-visite-ar.mp4" autoplay muted playsinline></video>
    </div>

    <!-- Le haut de la page : logo à gauche, menu à droite -->
    <header>
        <img src="img/logo.png" alt="Logo" class="logo">
        <nav>
            <a href="apropos.html">À propos</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Le titre, sous le header -->
    <h1>HEY !</h1>

    <!-- Le tableau : une boîte 16:9 qui contient ton fond ET les images -->
    <!-- left et top = le CENTRE de l'image (en % du tableau) -->
    <main>
        <div class="tableau">
            <a class="carte" href="projet1.html" style="left: 12.0%; top: 34.1%; rotate: -4deg;"><img src="img/projet1.png" alt=""></a>
            <a class="carte" href="projet2.html" style="left: 33.0%; top: 28.1%; rotate: 3deg;"><img src="img/projet2.png" alt=""></a>
            <a class="carte" href="projet3.html" style="left: 55.1%; top: 40.1%; rotate: -2deg;"><img src="img/projet3.png" alt=""></a>
            <a class="carte" href="projet4.html" style="left: 78.1%; top: 30.1%; rotate: 5deg;"><img src="img/projet4.png" alt=""></a>
            <a class="carte" href="projet5.html" style="left: 90.1%; top: 58.1%; rotate: -2.3deg;"><img src="img/projet5.png" alt=""></a>
            <a class="carte" href="projet6.html" style="left: 20.1%; top: 68.1%; rotate: 4deg;"><img src="img/projet6.png" alt=""></a>
            <a class="carte" href="projet7.html" style="left: 44.0%; top: 74.1%; rotate: -5deg;"><img src="img/projet7.png" alt=""></a>
            <a class="carte" href="projet8.html" style="left: 68.1%; top: 70.2%; rotate: 2deg;"><img src="img/projet8.png" alt=""></a>
        </div>
    </main>

    <!-- Tout en bas : mail + année -->
    <footer>
        <a href="mailto:alyssia.mattioni@gmail.com">alyssia.mattioni@gmail.com</a>
        <p>© 2026 Alyssia Mattioni</p>
    </footer>

    <!-- Les bulles qui flottent en fond (juste décoratives) -->
    <div class="bulle" style="top: 20%; left: 3%; rotate: 30deg;"></div>
    <div class="bulle" style="top: 32%; left: 91%; rotate: 90deg; animation-delay: 1s;"></div>
    <div class="bulle" style="top: 55%; left: 2%; rotate: 150deg; animation-delay: 2s;"></div>
    <div class="bulle" style="top: 68%; left: 92%; rotate: 210deg; animation-delay: 3s;"></div>
    <div class="bulle" style="top: 82%; left: 4%; rotate: 270deg; animation-delay: 1.5s;"></div>

</body>
</html>
