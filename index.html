<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>alyssia_mattioni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- L'animation du début : couvre tout l'écran, puis disparaît -->
    <div id="intro">
        <video id="video-intro" src="img/carte-visite-ar.mp4" autoplay muted playsinline></video>
    </div>

    <!-- Le haut de la page : logo à gauche, menu à droite -->
    <header>
        <img src="img/logo.png" alt="Logo" class="logo">
        <nav>
            <a href="apropos.html">À propos</a>
            <a href="sketchbook.html">Sketchbook</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Premier écran : HEY ! au milieu -->
    <section class="accueil">
        <h1>HEY !</h1>
        <p class="fleche">↓</p>
    </section>

    <!-- Deuxième écran : la grille -->
    <section class="section-grille">
        <div class="grille">
            <a href="#">Projet 1</a>
            <a href="#">Projet 2</a>
            <a href="#">Projet 3</a>
            <a href="#">Projet 4</a>
            <a href="#">Projet 5</a>
            <a href="#">Projet 6</a>
            <a href="#">Projet 7</a>
            <a href="#">Projet 8</a>
        </div>
    </section>

    <!-- Le bas de la page -->
    <footer>
        <p><a href="mailto:alyssia.mattioni@gmail.com">alyssia.mattioni@gmail.com</a></p>
        <p>© 2026 Alyssia Mattioni</p>
    </footer>

    <!-- Les bulles qui flottent en fond (juste décoratives) -->
    <div class="bulle" style="top: 10%; left: 14%; rotate: 30deg;"></div>
    <div class="bulle" style="top: 25%; left: 70%; rotate: 90deg; animation-delay: 1s;"></div>
    <div class="bulle" style="top: 50%; left: 20%; rotate: 150deg; animation-delay: 2s;"></div>
    <div class="bulle" style="top: 65%; left: 80%; rotate: 210deg; animation-delay: 3s;"></div>
    <div class="bulle" style="top: 85%; left: 40%; rotate: 270deg; animation-delay: 1.5s;"></div>

    <!-- Le petit script qui cache l'animation quand elle est finie -->
    <script>
        const intro = document.getElementById("intro");
        const video = document.getElementById("video-intro");

        // Cache l'animation et retient qu'elle a été vue
        function fermerIntro() {
            intro.style.display = "none";
            sessionStorage.setItem("introVue", "oui");
        }

        // Si elle a déjà été vue pendant cette visite, on ne la rejoue pas
        if (sessionStorage.getItem("introVue") === "oui") {
            intro.style.display = "none";
        }

        video.addEventListener("ended", fermerIntro); // quand la vidéo se termine
        video.addEventListener("error", fermerIntro); // si le fichier est introuvable
        setTimeout(fermerIntro, 8000);                // sécurité : après 8 secondes, on ferme
    </script>

</body>
</html>
